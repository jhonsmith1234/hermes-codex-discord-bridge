name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-contract:
    name: package-contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML

      - name: Run package contract tests
        run: python -m pytest -q tests/test_package_contract.py

      - name: Compile plugin and check patch formatting
        run: |
          python -m py_compile plugin/codex_tasks/__init__.py
          git diff --check
